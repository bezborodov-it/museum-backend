services:
  api:
    build: .
    restart: always
    container_name: mus_api_${API_MODE}
    env_file:
      - ./.env
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - ./api/static:/app/api/static
      - ./logs:/app/logs
    networks:
      - museum

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - museum

  worker:
    build: .
    command: celery -A api.celery.worker worker --loglevel=INFO --logfile=/app/logs/celery.log
    restart: always
    environment:
      - CELERY_BROKER_URL=amqp://${RABBIT_USER}:${RABBIT_PASSWORD}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=rpc://
    networks:
      - museum
    volumes:
      - .:/app
    working_dir: /app

  flower:
    build: .
    container_name: flower
    command: celery --broker=amqp://${RABBIT_USER}:${RABBIT_PASSWORD}@rabbitmq:5672// flower --port=5555
    restart: always
    ports:
      - "5555:5555"
    depends_on:
      - api
      - worker
    environment:
      - CELERY_BROKER_URL=amqp://${RABBIT_USER}:${RABBIT_PASSWORD}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=rpc://
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - museum

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    networks:
      - museum


networks:
  museum:
    driver: bridge

volumes:
  postgres_data:
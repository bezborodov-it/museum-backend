version: '3'

services:
  api:
    build: .
    image: ${image}:${tag}
    restart: always
    container_name: mus_api_${API_MODE}
    env_file:
      - ./.env
    ports:
      - "8080:8080"
    networks:
      - museum

  postgres:
    image: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - museum

  redis:
    image: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    ports:
      - "6379:6379"
    networks:
      - museum

  worker:
    build: .
    command: celery -A api.service.celery worker --loglevel=info
    restart: always
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - museum
    volumes:
      - .:/app
    working_dir: /app

  flower:
    build: .
    container_name: flower
    command: celery --broker=redis://:${REDIS_PASSWORD}@redis:6379/0 flower --port=5555
    restart: always
    ports:
      - "5555:5555"
    depends_on:
      - api
      - redis
      - worker
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - museum

  beat:
    image: ${image}:${tag}
    container_name: celery_beat
    command: celery -A api.service.celery beat --loglevel=info
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - museum


networks:
  museum:
    driver: bridge